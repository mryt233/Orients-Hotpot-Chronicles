# 之晗的火锅物语 · NeoForge 元数据（mryt233 2026-10-30）
# mryt233 改（2026-11-10）：介绍与 Fabric 保持一致。
modLoader="javafml"
loaderVersion="[4,)"
license="MIT AND CC-BY-NC-SA-4.0"
issueTrackerURL="https://github.com/mryt233/Orients-Hotpot-Chronicles/issues"

[[mods]]
modId="orients_hotpot_chronicles"
version="${version}"
displayName="Orient's Hotpot Chronicles"
authors="mryt233"
description='''
A bubbling Chongqing nine-grid hotpot on a brick stove: fuel the stove, seat a copper or iron pot, pour in a broth, drop ingredients into the 9x9 grid and pick them out cooked (with furnace XP) - all with one pair of chopsticks.
'''

[[mixins]]
config="orients_hotpot_chronicles.mixins.json"

# 依赖：Minecraft 1.21.1 与 NeoForge 21.1.x，两边都是必需项
[[dependencies.orients_hotpot_chronicles]]
modId="neoforge"
type="required"
# mryt233 改：最低运行版本独立于编译依赖，21.1.186 已通过两端基础加载测试。
versionRange="[21.1.186,)"
ordering="NONE"
side="BOTH"

[[dependencies.orients_hotpot_chronicles]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"
