// 作者：mryt233
plugins { id 'net.fabricmc.fabric-loom' }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':common')
    implementation project(':framework:client')
}
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')
sourceSets.main.java.srcDirs += [project(':common').file('src/client/java'), project(':common').file('src/mixin/java')]
// mryt233 改：JEI / REI / Mod Menu / Jade 的编译期签名桩只参与编译，成品与源码 jar 都排除（见下方 exclude）。
sourceSets.main.java.srcDirs += [project(':common').file('src/compatApi/java')]
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
// mryt233 改：前置单独打成 orient_framework jar，内嵌进本体（META-INF/jars，fabric.mod.json 的 jars 已登记）。
def frameworkJar = tasks.register('frameworkJar', Jar) {
    dependsOn ':framework:pure:classes', ':framework:loader:classes', ':framework:loader:processResources', ':framework:game:classes', ':framework:client:classes', 'classes'
    archiveFileName = 'orient_framework-26.2-fabric-0.2.0.jar'
    manifest.attributes 'Automatic-Module-Name': 'cn.blockforge.orient.framework'
    destinationDirectory = layout.buildDirectory.dir('framework')
    from(sourceSets.main.output.classesDirs) { include 'cn/blockforge/orient/framework/**' }
    for (module in ['pure', 'loader', 'game', 'client']) {
        from(project(":framework:${module}").sourceSets.main.output.classesDirs) { include 'cn/blockforge/orient/framework/**' }
    }
    from(project(':framework:loader').file('src/main/resources'))
    from 'src/runtime/resources'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('jar') {
    dependsOn frameworkJar
    archiveFileName = "${archives_base_name}-26.2-fabric-${version}.jar"
    from(project(':common').sourceSets.main.output.classesDirs)
    exclude 'cn/blockforge/generated/orientshotpotchronicles/devtest/**'
    exclude 'cn/blockforge/orient/framework/**'
    // mryt233 改：compatApi 签名桩不进成品，运行时用玩家自己装的那份。
    exclude 'mezz/jei/**', 'me/shedaniel/**', 'com/terraformersmc/**', 'snownee/jade/**'
    from(frameworkJar) { into 'META-INF/jars' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('sourcesJar') { exclude 'cn/blockforge/generated/orientshotpotchronicles/devtest/**', 'mezz/jei/**', 'me/shedaniel/**', 'com/terraformersmc/**', 'snownee/jade/**' }
loom {
    runs {
        client { runDir 'run-client' }
        server { runDir 'run-server' }
    }
}

// mryt233 改：开发探针仅由独立测试工程编译。
sourceSets.main.java.exclude 'cn/blockforge/generated/orientshotpotchronicles/devtest/**'
sourceSets.main.resources.srcDirs += project(':framework:loader').file('src/main/resources')

// mryt233 改：测试网络与配置平台实现，不改变前置运行代码。
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
