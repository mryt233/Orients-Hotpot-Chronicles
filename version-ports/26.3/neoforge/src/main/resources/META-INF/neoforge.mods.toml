# 之晗的火锅物语 · NeoForge 元数据（mryt233 2026-10-30）
#
modLoader="javafml"
loaderVersion="[4,)"
license="MIT AND CC-BY-NC-SA-4.0"
issueTrackerURL="https://github.com/"

[[mods]]
modId="orients_hotpot_chronicles"
version="${version}"
displayName="Orient's Hotpot Chronicles"
authors="mryt233"
description='''
A bubbling Chongqing nine-grid hotpot on a brick stove: fuel the stove, seat a copper or iron pot,
pour in a broth, drop ingredients into the 9x9 grid and pick them out cooked (with furnace XP).
'''

[[mixins]]
config="orients_hotpot_chronicles.mixins.json"

[[mixins]]
config="orients_hotpot_chronicles.neoforge.mixins.json"

[[dependencies.orients_hotpot_chronicles]]
modId="neoforge"
type="required"
# mryt233 改：以 26.3 首个正式版作为候选下限，按官方安装库和独立服验收。
versionRange="[26.3.0.76,)"
ordering="NONE"
side="BOTH"

[[dependencies.orients_hotpot_chronicles]]
modId="minecraft"
type="required"
# mryt233 改：本包只支持正式 Minecraft 26.3。
versionRange="[26.3]"
ordering="NONE"
side="BOTH"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

# 前置 orient_framework（内嵌在本 jar 里）
[[dependencies.orients_hotpot_chronicles]]
modId="orient_framework"
type="required"
versionRange="[0.2.2,0.3.0)"
ordering="AFTER"
side="BOTH"

