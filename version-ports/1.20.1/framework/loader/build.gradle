// framework:loader —— 平台能力契约层（作者：mryt233，2026-10-30，P1 第一批）。
// 允许引用原版类型，不出现任何加载器 import；实现由 platform/* 提供。
plugins {
    id 'dev.architectury.loom' version '1.10.455'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation project(':framework:pure')
}
// 单元测试（前置检查 W8，mryt233 2026-11-01）：模块排序 / 跨模组依赖 / 重复 id
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// 作者：mryt233；独立前置的访问器也必须携带映射。
loom { mixin { defaultRefmapName = 'orient_framework.refmap.json' } }

// mryt233 改：发布能力供 Fabric include 识别独立前置的坐标。
configurations {
    fabricRuntimeElements {
        canBeConsumed = true
        canBeResolved = false
        outgoing.capability("cn.blockforge.orient:orient_framework-fabric:${project.framework_version}")
    }
}
