// 作者：mryt233
plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

sourceSets {
    frameworkRuntime {
        java.srcDirs = [file('src/main/java'), rootProject.file('framework/pure/src/main/java'),
            rootProject.file('framework/loader/src/main/java'), rootProject.file('framework/game/src/main/java'),
            rootProject.file('framework/client/src/main/java')]
        java.include 'cn/blockforge/orient/framework/**'
        resources.srcDirs = [file('src/runtime/resources'), rootProject.file('framework/loader/src/main/resources')]
    }
    main {
        java.srcDirs += [project(':common').file('src/client/java'), project(':common').file('src/mixin/java'),
            // 作者：mryt233（0.2.2-alpha）：Mod Menu / JEI / REI / Jade 的编译期签名桩，只参与编译。
            project(':common').file('src/compatApi/java')]
        java.exclude 'cn/blockforge/orient/framework/**', '**/devtest/**'
        resources.srcDirs += project(':common').file('src/main/resources')
    }
}

java.registerFeature('frameworkRuntime') { usingSourceSet(sourceSets.frameworkRuntime) }

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    addModdingDependenciesTo(sourceSets.frameworkRuntime)
    runs {
        client {
            client()
            gameDirectory = file('run-client')
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
    }
    mods {
        orient_framework { sourceSet sourceSets.frameworkRuntime }
        orients_hotpot_chronicles {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

dependencies {
    implementation files(project(':common').sourceSets.main.output, sourceSets.frameworkRuntime.output)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    frameworkRuntimeAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'orients_hotpot_chronicles.refmap.json'
    add sourceSets.frameworkRuntime, 'orient_framework.refmap.json'
    config 'orients_hotpot_chronicles.mixins.json'
    config 'orient_framework.mixins.json'
    config 'orients_hotpot_chronicles.forge.mixins.json'
}

tasks.named('compileJava') { dependsOn ':common:classes', 'frameworkRuntimeClasses' }
tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn ':common:processResources'
    inputs.property 'version', project.version // mryt233 改：version 变更时触发 mods.toml 重新展开
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

def runtimeJar = tasks.register('runtimeJar', Jar) {
    archiveBaseName = 'orient_framework-1.20.1-forge'
    archiveVersion = project.framework_version
    from sourceSets.frameworkRuntime.output
    from(layout.buildDirectory.dir('mixin')) { include 'orient_framework.refmap.json' }
    manifest.attributes 'MixinConfigs': 'orient_framework.mixins.json'
    manifest.attributes 'Automatic-Module-Name': 'cn.blockforge.orient.framework'
}
def reobfRuntimeJar = obfuscation.reobfuscate(runtimeJar, sourceSets.frameworkRuntime)
reobfRuntimeJar.configure { dependsOn tasks.named('compileJava') }
dependencies { jarJar files(reobfRuntimeJar) }

// 作者：mryt233（0.2.2-alpha）：JEI / REI / Jade / Mod Menu 的编译期签名桩不进分发包。
tasks.named('jar', Jar) {
    exclude 'mezz/jei/**', 'me/shedaniel/**', 'snownee/jade/**', 'com/terraformersmc/**'
    archiveBaseName = 'orients_hotpot_chronicles-1.20.1-forge'
    from(project(':common').sourceSets.main.output.classesDirs)
    manifest.attributes 'MixinConfigs': 'orients_hotpot_chronicles.mixins.json,orients_hotpot_chronicles.forge.mixins.json'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('sourcesJar', Jar) {
    exclude 'mezz/jei/**', 'me/shedaniel/**', 'snownee/jade/**', 'com/terraformersmc/**'
    from project(':common').sourceSets.main.allJava
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
