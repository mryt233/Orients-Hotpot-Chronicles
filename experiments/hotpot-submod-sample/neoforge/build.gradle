// 作者：mryt233：第四批 4L-1 最小 Java 测试子模组（NeoForge 入口）。
plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'cn.blockforge.sample'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

base {
    archivesName = 'hotpot-submod-sample-neoforge'
}

sourceSets {
    main {
        java.srcDir '../common/src/main/java'
        resources.srcDir '../common/src/main/resources'
    }
}

neoForge {
    version = '21.1.265'
    mods {
        hotpotsubmod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly files(
        '../../../common/build/classes/java/main',
        '../../../common/build/classes/java/client',
        '../../../neoforge/build/classes/java/main',
        '../../../framework/pure/build/classes/java/main',
        '../../../framework/loader/build/classes/java/main',
        '../../../framework/game/build/classes/java/main',
        '../../../framework/client/build/classes/java/main'
    )
}
